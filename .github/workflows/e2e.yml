name: E2E
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 14 * * *'
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-printer:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install network isolation tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap openssl
      - name: Rebuild from repository only
        run: python ops/bootstrap.py
      - name: Run E2E workflows and network faults
        run: .venv-candidate/bin/python harness/run.py --rounds 3 --cycles 8
      - name: Save reports and replay seeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: evidence/harness/
          if-no-files-found: error
          retention-days: 30
