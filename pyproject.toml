[build-system]
requires = ["setuptools>=76"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["bambu_mcp.egg-info*", "*.egg-info", "vendor*"]

[project]
name = "bambu-mcp"
version = "0.9.0"
requires-python = ">=3.12"
dependencies = [
    "keyring",
    "mcp[cli]==1.26.0",
    "cryptography",
    "av>=14.0",
    "pillow",
    "numpy",
    "matplotlib>=3.9",
    "bambu-printer-manager==2.0.0rc2",
    "flask>=3.0",
    "flask-cors>=4.0",
    "zeroconf>=0.131",
    "setproctitle>=1.3",
]

[project.scripts]
bambu-mcp = "server:main"
